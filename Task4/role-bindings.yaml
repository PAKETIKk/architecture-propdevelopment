# rolebinding-security-admin
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebinding-security-admin
  namespace: development
subjects:
- kind: ServiceAccount
  name: security-admin-user
  namespace: development
roleRef:
  kind: Role
  name: security-admin
  apiGroup: rbac.authorization.k8s.io

---

# rolebinding-viewer
apiVersion: rbac.authorization.k8s.io/v1
